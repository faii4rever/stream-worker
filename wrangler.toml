name = "stream"                 # ganti sesuai nama Worker-mu (hasilnya <name>.<akun>.workers.dev)
main = "worker.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./public"          # isi: index.html, data.js, logo.png
binding = "ASSETS"
run_worker_first = ["/api/*"]   # /api/* ke worker.js, sisanya file statis

[vars]
SITE_HOST = "animeindo.me"
# SIGN_KEY jangan ditaruh di sini; set sebagai secret:  npx wrangler secret put SIGN_KEY
